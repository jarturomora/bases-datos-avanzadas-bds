services:
  mysql:
    image: mysql:9.0
    container_name: mysql_tema2_2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tema2_2_demo
      MYSQL_USER: alumno
      MYSQL_PASSWORD: alumno
      TZ: Europe/Madrid
    ports:
      - "3307:3306"
    volumes:
      - mysql_tema2_2_data:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -hlocalhost -uroot -proot || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma_tema2_2
    environment:
      PMA_HOST: mysql
      PMA_USER: alumno
      PMA_PASSWORD: alumno
      PMA_PORT: 3306
    ports:
      - "8082:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_tema2_2_data:
